name: Build & Release NCC Bundle

on:
  push:
    branches:
      - master
      - mikro-orm

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build NestJS
        run: pnpm build

      - name: Generate metadata cache
        run: npx mikro-orm cache:generate --combined
        env:
          DATABASE_URL: mysql://root:dummy@localhost:3306/dummy

      - name: Generate SQL migration file
        run: |
          mkdir -p bundle
          cat > /tmp/gen-sql.js << 'EOF'
          const { Migration20260823164321 } = require('./dist/src/database/migrations/Migration20260823164321.js');
          const sqls = [];
          const instance = Object.create(Migration20260823164321.prototype);
          instance.addSql = (s) => sqls.push(s);
          Migration20260823164321.prototype.up.call(instance);
          require('fs').writeFileSync('bundle/generated.sql', sqls.join('\n'));
          EOF
          node /tmp/gen-sql.js

      - name: Bundle with NCC
        run: pnpm bundle

      - name: Patch bundle for CJS compatibility
        run: pnpm bundle:patch

      - name: Copy assets
        run: cp -r assets bundle/assets

      - name: Create zip file
        run: |
          cd bundle
          zip -r ../bundle.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ncc-${{ github.run_number }}
          name: 'NCC Build ${{ github.run_number }}'
          draft: false
          prerelease: false
          files: bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
